# go vet, the Go tests and the query designer's SQL round trips, on every push.
name: checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Query designer round trips
        run: node .github/ci/pq-roundtrip.mjs
